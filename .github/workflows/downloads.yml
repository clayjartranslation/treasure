name: Rebuild downloads

on:
  push:
    branches: [main]
    paths:
      - 'data/books/**'
      - 'data/books.json'
      - 'tools/build-downloads.js'
      - 'downloads/IMAGE-CREDITS.md'
      - 'downloads/images/**'
      - 'downloads.html'
      - '.github/workflows/downloads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo cp /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          curl -fsSL -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
      - name: Build PDF and EPUB
        run: node tools/build-downloads.js
        env:
          EPUBCHECK: /tmp/epubcheck-5.2.1/epubcheck.jar
      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads downloads.html
          if git diff --cached --quiet; then
            echo "Downloads already match the published books."
          else
            git commit -m "Rebuild Clay Jar Treasure Bible downloads"
            git push
          fi
