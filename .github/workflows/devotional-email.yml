name: Daily devotional email

# Runs every hour. The script emails only subscribers whose local time is
# in the 4 AM hour and who have not already received that local date's reading.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print counts and a sample email and do not send'
        type: boolean
        default: true
      test_email:
        description: 'Send today’s devotional only to this address. Does not email the list.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: devotional-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Send today's devotional
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node tools/send-devotional-email.js
