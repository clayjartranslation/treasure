name: Daily devotional email

# Runs every hour, plus extra times around 4–6 AM Eastern, so a delayed
# or skipped GitHub cron still delivers today's email. The script emails
# subscribers whose local time is 4:00 AM or later and who have not
# already received today's reading.
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '5 9,10 * * *'
    - cron: '35 9,10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print counts and a sample email and do not send'
        type: boolean
        default: true
      test_email:
        description: 'Send today’s devotional only to this address. Does not email the list.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: devotional-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Send today's devotional
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node tools/send-devotional-email.js
