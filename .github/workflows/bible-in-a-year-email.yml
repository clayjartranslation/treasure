name: Daily Bible in a Year email

# Runs every hour, plus extra times around 4–6 AM Eastern, so a delayed
# or skipped GitHub cron still delivers today's email. The script emails
# the list when it is 4:00 AM or later in America/New_York and today's
# Eastern Time reading has not already gone out.
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '5 9,10 * * *'
    - cron: '35 9,10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print counts and a sample email and do not send'
        type: boolean
        default: true
      test_email:
        description: 'Send today’s readings only to this address. Does not email the list.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bible-in-a-year-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Send today's Bible in a Year email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: '6'
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: node tools/send-bible-in-a-year-email.js
