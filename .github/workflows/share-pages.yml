name: Rebuild share pages

on:
  push:
    branches: [main]
    paths:
      - 'data/books/**'
      - 'data/books.json'
      - 'tools/build-share-pages.js'
      - '.github/workflows/share-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build share pages
        run: node tools/build-share-pages.js
      - name: Commit share pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A s
          if git diff --cached --quiet; then
            echo "Share pages already match the published books."
            exit 0
          fi
          git commit -m "Rebuild share pages"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
