name: Rebuild share pages and sitemap

on:
  push:
    branches: [main]
    paths:
      - 'data/books/**'
      - 'data/books.json'
      - 'tools/build-share-pages.js'
      - 'tools/build-sitemap.js'
      - '.github/workflows/share-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build share pages and sitemap
        run: |
          node tools/build-share-pages.js
          node tools/build-sitemap.js
      - name: Commit share pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A s sitemap.xml
          if git diff --cached --quiet; then
            echo "Share pages and sitemap already match the published books."
            exit 0
          fi
          git commit -m "Rebuild share pages and sitemap"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
